<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>SSE Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Sen:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <script type='text/javascript'>
        function initEmbeddedMessaging() {
            try {
                embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'

                embeddedservice_bootstrap.init(
                    '00DKd000007Vbo8',
                    'Order_Management_External',
                    'https://de1733391707655.my.site.com/ESWOrderManagementExter1751272087972',
                    {
                        scrt2URL: 'https://de1733391707655.my.salesforce-scrt.com'
                    }
                );
            } catch (err) {
                console.error('Error loading Embedded Messaging: ', err);
            }
        };
    </script>
    <script type='text/javascript'
        src='https://de1733391707655.my.site.com/ESWOrderManagementExter1751272087972/assets/js/bootstrap.min.js'
        onload='initEmbeddedMessaging()'>
        </script>
    <!-- Server Sent Events Client -->
    <script>
        //const eventSource = new EventSource('http://localhost:3000/events');
        var webSocket = new WebSocket('wss://trish-perisarcous-stephan.ngrok-free.dev');

        webSocket.onopen = function (event) {
            // wsStatus.textContent = 'Connected';
            //wsStatus.className = 'status connected';
            console.log('WebSocket connection opened');
        };

        // Patch WebSocket handler
        if (window.webSocket) {
            webSocket.onmessage = function (event) {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received WebSocket message:', message);
                    console.log('Received WebSocket message:', message.data);
                    console.log('Received WebSocket message:', message.data.payload);
                    if (message.data.payload.DCC_Context_Identifier__c === 'showJeans' || message.data.payload.DCC_Context_Identifier__c === 'showJacket') {
                        showSection(message.data.payload.DCC_Context_Identifier__c);
                    }
                } catch (error) {
                    console.error('Error parsing WebSocket message:', error);
                }
            };
        }

    </script>

    <div id="default-message" class="default-message" style="display:block;">
        <img src="img/home.png" alt="">
    </div>
    <!-- Jeans Modal -->
    <div id="jeans-section" class="modal-overlay" style="display:none;">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Jeans Order Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="img-container">
                    <img src="img/jeans.png" alt="Jeans">
                </div>
                <div class="order-info">
                    <div class="info-item">
                        <span class="label">Order ID:</span>
                        <span class="value">12345</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Product:</span>
                        <span class="value">Blue Jeans</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Quantity:</span>
                        <span class="value">2</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Status:</span>
                        <span class="value status-shipped">Shipped</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="okayButtonClicked()">Confirm</button>
                <button class="btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>
    <!-- Jacket Modal -->
    <div id="jacket-section" class="modal-overlay" style="display:none;">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Jacket Order Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="img-container">
                    <img src="img/jacket.jpg" alt="Jacket">
                </div>
                <div class="order-info">
                    <div class="info-item">
                        <span class="label">Order ID:</span>
                        <span class="value">67890</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Product:</span>
                        <span class="value">Leather Jacket</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Quantity:</span>
                        <span class="value">1</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Status:</span>
                        <span class="value status-processing">Processing</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="okayButtonClicked()">Confirm</button>
                <button class="btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>
    <script>
        // Helper to show/hide sections
        function showSection(message) {
            const jeansSection = document.getElementById('jeans-section');
            const jacketSection = document.getElementById('jacket-section');
            const defaultMessage = document.getElementById('default-message');
            if (message === 'showJeans') {
                jeansSection.style.display = 'flex';
                jacketSection.style.display = 'none';
                // defaultMessage.style.display = 'none';
            } else if (message === 'showJacket') {
                jeansSection.style.display = 'none';
                jacketSection.style.display = 'flex';
                // defaultMessage.style.display = 'none';
            } else {
                jeansSection.style.display = 'none';
                jacketSection.style.display = 'none';
                defaultMessage.style.display = 'flex';
            }
        }
        function okayButtonClicked() {
            embeddedservice_bootstrap.utilAPI.sendTextMessage('Looks fine, show next order details');
        }
        
        function closeModal() {
            const jeansSection = document.getElementById('jeans-section');
            const jacketSection = document.getElementById('jacket-section');
            const defaultMessage = document.getElementById('default-message');
            
            jeansSection.style.display = 'none';
            jacketSection.style.display = 'none';
            defaultMessage.style.display = 'flex';
        }
    </script>

</html>
